version: '3.8'

services:
  identidad:
    build: ./modules/01-identidad
    ports:
      - "8001:80"
    networks:
      - ciberurjc

  ids:
    build: ./modules/02-ids
    ports:
      - "8002:80"
    networks:
      - ciberurjc

  honeypot:
    build: ./modules/03-honeypot
    ports:
      - "8003:80"
    networks:
      - ciberurjc

  escaner:
    build: ./modules/04-escaner
    ports:
      - "8004:80"
    networks:
      - ciberurjc

  siem:
    build: ./modules/05-siem
    ports:
      - "8005:80"
    networks:
      - ciberurjc

  soar:
    build: ./modules/06-soar
    ports:
      - "8006:80"
    networks:
      - ciberurjc

  dashboard:
    build: ./modules/07-dashboard
    ports:
      - "8007:80"
    networks:
      - ciberurjc
    depends_on:
      - identidad
      - escaner
      - siem
      - soar

  pentesting:
    build: ./modules/08-pentesting
    ports:
      - "8008:80"
    networks:
      - ciberurjc

networks:
  ciberurjc:
    driver: bridge