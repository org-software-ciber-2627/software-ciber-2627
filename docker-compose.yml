version: '3.8'

services:
  identidad:
    build: ./modules/01-identidad
    ports:
      - "8001:80"
    networks:
      - ciberurjc
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      AES_KEY: ${AES_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SERVICE_PASSWORD: ${SERVICE_PASSWORD:-}
      SECRET_DB_PASSWORD: ${SECRET_DB_PASSWORD:-}
      SECRET_API_KEY: ${SECRET_API_KEY:-}
      SECRET_JWT_SECRET: ${SECRET_JWT_SECRET:-}
      IDS_URL: "http://ids/logs"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ids:
    build: ./modules/02-ids
    ports:
      - "8002:80"
    networks:
      - ciberurjc
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  honeypot:
    build: ./modules/03-honeypot
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.5"
    mem_limit: 512m
    mem_reservation: 256m
    ports:
      - "127.0.0.1:8003:80"
      - "127.0.0.1:2121:2121"
      - "127.0.0.1:2222:2222"
    environment:
      - HONEYPOT_SSH_HOSTKEY=/http/data/hostkey.ser
    volumes:
      - honeypot-data:/http/data
    networks:
      - honeypot-publica
      - honeypot-siem
      - ciberurjc
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    restart: unless-stopped

  escaner:
    build: ./modules/04-escaner
    ports:
      - "8004:80"
    networks:
      - ciberurjc
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  siem:
    build: ./modules/05-siem
    ports:
      - "8005:80"
    networks:
      - ciberurjc
      - honeypot-siem
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  soar:
    build: ./modules/06-soar
    ports:
      - "8006:80"
    environment:
      SIEM_URL: ${SIEM_URL:-http://siem:80}
      DATABASE_PATH: /data/soar.db
      POLL_INTERVAL_SECONDS: ${SOAR_POLL_INTERVAL_SECONDS:-0}
    volumes:
      - soar-data:/data
    depends_on:
      siem:
        condition: service_healthy
    networks:
      - ciberurjc
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    build: ./modules/07-dashboard
    ports:
      - "8007:80"
    networks:
      - ciberurjc
    depends_on:
      - identidad
      - escaner
      - siem
      - soar
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  pentesting:
    build: ./modules/08-pentesting
    ports:
      - "8008:80"
    networks:
      - ciberurjc
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  ciberurjc:
    driver: bridge
  honeypot-publica:
    driver: bridge
  honeypot-siem:
    driver: bridge
    internal: true

volumes:
  honeypot-data:
  soar-data:
