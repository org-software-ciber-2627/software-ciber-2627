openapi: 3.0.3
info:
  title: Identidad y secretos
  version: 1.3.0
  description: |
    API de autenticación, gestión de usuarios, acceso a secretos y registro de auditoría interno.

    **Token.** `POST /auth/login` y `POST /auth/register` devuelven un JWT firmado con HS256
    (claims: `sub` = nombre de usuario, `role`, `user_id`, `iat`, `exp`). Caducidad: 30 minutos
    (valor del Sprint 1; cualquier cambio se avisará por Pull Request y por Teams).

    **Cómo validar desde otro módulo.** No decodifiquéis ni verifiquéis el token por vuestra
    cuenta: llamad a `GET /auth/validate` con la cabecera `Authorization: Bearer <token>`.

    **Roles.** `admin`, `analista` y `servicio`. Los usuarios registrados por `POST /auth/register`
    nacen con rol `analista`; las cuentas `admin` y `servicio` se precargan en el Sprint 1.

    **Secretos.** `GET /secrets/{clave}` solo está permitido al rol `servicio`.

    **Auditoría.** El módulo registra internamente los intentos de login (`login_ok`,
    `login_failed`, `invalid_user`, `limit_exceeded`) y los accesos a secretos (`secret_read`,
    `secret_denied`) y los envía al IDS (`POST /logs` del módulo 2). No hay endpoint público para
    consultarlos. El registro nunca contiene contraseñas, tokens ni valores de secretos.

    **Cierre de sesión (novedad 1.2.0).** `POST /auth/logout` invalida el token actual. Desde
    ese momento, ese token se trata como inválido: `GET /auth/validate`, y `GET /secrets/{clave}`
    responden `401` con él. Los demás módulos no cambian nada: siguen validando
    solo con `GET /auth/validate`.

    **Salud.** `GET /health` lo usan el CI y el docker-compose del monorepo.

    Resumen de formato de error: `{ "error": "<mensaje>" }` (y `{ "valid": false, "error": "<mensaje>" }`
    en `/auth/validate`).

    **Historial.** 1.3.0: se retira `GET /audit` (nunca llegó a implementarse ni lo usa ningún módulo);
    se documentan el límite de intentos de login (`429`) y el evento `limit_exceeded`.
    1.2.0: se añade `POST /auth/logout` (cambio compatible, no modifica los endpoints existentes).
    1.1.0: se añade `GET /audit` (cambio compatible).
  contact:
    name: CypherGate
servers:
  - url: http://localhost:8001
    description: Entorno local con docker compose
paths:
  /health:
    get:
      summary: Estado del servicio
      description: Lo consultan el CI y el docker-compose. Debe responder 200 en el puerto interno 80.
      operationId: health
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/register:
    post:
      summary: Registro de un usuario
      description: Registra una nueva cuenta de usuario con rol analista y devuelve un JWT.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Datos de entrada no válidos o incompletos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El usuario o el email ya existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error no esperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      summary: Login
      description: Autentica a un usuario con nombre de usuario y contraseña y devuelve un JWT. Cada intento queda en el registro de auditoría.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Usuario y contraseña correctos. Devuelve un JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Falta el nombre de usuario o la contraseña
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Usuario o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >
            Demasiados intentos de autenticación. El bloqueo se aplica
            por combinación de usuario e IP. Retry-After indica los
            segundos restantes. Se registra limit_exceeded una sola
            vez al alcanzar el límite durante el episodio de bloqueo.
          headers:
            Retry-After:
              description: Segundos restantes hasta que expire el bloqueo.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error no esperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/validate:
    get:
      summary: Validar JWT
      description: Comprueba si el token JWT proporcionado es válido y devuelve la información del usuario y su rol.
      operationId: validateToken
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
        '401':
          description: Token inválido, expirado, revocado o no autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateError'
        '500':
          description: Error no esperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      summary: Cerrar sesión
      description: >
        Invalida el token JWT con el que se hace la petición. No lleva cuerpo. Después, ese token
        deja de ser válido en todos los endpoints. Si el token ya era inválido, estaba caducado o
        ya se había cerrado la sesión con él, responde 401.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token revocado. La sesión queda cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Token inválido, expirado, revocado o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error no esperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /secrets/{clave}:
    get:
      summary: Obtener secreto
      description: >
        Obtiene el secreto asociado a la clave proporcionada. Requiere un token JWT válido
        y que el usuario esté autenticado con el rol servicio. El acceso (concedido o denegado)
        queda en el registro de auditoría.
      operationId: getSecret
      security:
        - BearerAuth: []
      parameters:
        - name: clave
          in: path
          required: true
          description: Clave del secreto que se desea obtener
          schema:
            type: string
          example: api_key
      responses:
        '200':
          description: Secreto obtenido correctamente
          headers:
            Cache-Control:
              description: Siempre no-store; la respuesta no debe almacenarse en caché.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '400':
          description: Clave no válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token inválido, expirado, revocado o no autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token válido, pero el rol no es servicio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No se encontró un secreto para la clave proporcionada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error no esperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - module
      properties:
        status:
          type: string
          description: Estado del servicio
          example: ok
        module:
          type: string
          description: Identificador del módulo
          example: 01-identidad
    RegisterRequest:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: Nombre de usuario
          example: usuario.ejemplo
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Contraseña del usuario (nunca se almacena en claro)
          example: '<tu-contraseña>'
        email:
          type: string
          format: email
          description: Email del usuario
          example: usuario.ejemplo@ciberurjc.local
    RegisterResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Token JWT
          example: eyJhbGciOiJIUzI1NiIs...
        user:
          $ref: '#/components/schemas/UserResponse'
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Nombre de usuario
          example: usuario.ejemplo
        password:
          type: string
          format: password
          description: Contraseña del usuario
          example: '<tu-contraseña>'
    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Token de acceso JWT
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - role
      properties:
        id:
          type: integer
          description: Identificador del usuario
          example: 1
        username:
          type: string
          description: Nombre de usuario
          example: usuario.ejemplo
        email:
          type: string
          format: email
          description: Email del usuario
          example: usuario.ejemplo@ciberurjc.local
        role:
          $ref: '#/components/schemas/Role'
    Role:
      type: string
      enum:
        - analista
        - admin
        - servicio
      description: Rol del usuario
      example: analista
    LogoutResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Confirmación del cierre de sesión
          example: Token revocado
    ValidateResponse:
      type: object
      required:
        - valid
        - user_id
        - username
        - role
      properties:
        valid:
          type: boolean
          description: Indica si el token es válido
          example: true
        user_id:
          type: integer
          description: Identificador del usuario (el mismo que `UserResponse.id`)
          example: 1
        username:
          type: string
          description: Nombre de usuario
          example: usuario.ejemplo
        role:
          $ref: '#/components/schemas/Role'
    ValidateError:
      type: object
      required:
        - error
        - valid
      properties:
        error:
          type: string
          description: Motivo del fallo en la validación del token
          example: Token inválido, expirado o ausente
        valid:
          type: boolean
          description: Siempre `false`
          example: false
    SecretResponse:
      type: object
      required:
        - clave
        - valor
      properties:
        clave:
          type: string
          description: Clave del secreto
          example: api_key
        valor:
          type: string
          description: Valor del secreto descifrado
          example: '<valor-del-secreto>'
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Mensaje de error
          example: Usuario o contraseña incorrectos
