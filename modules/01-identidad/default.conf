server {
    listen 80;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","module":"01-identidad"}';
    }

    location / {
        default_type application/json;
        return 200 '{"module":"01-identidad","note":"placeholder - reemplazad este contenedor por vuestro servicio real"}';
    }
}
