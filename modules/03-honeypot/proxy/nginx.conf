worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

# Único punto de entrada al honeypot, que no tiene salida a internet (HP-89)
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 80;

        location / {
            proxy_pass http://honeypot-interno:80;
            proxy_set_header Host $host;
            # Se sobrescribe para que el atacante no pueda falsear su IP
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

stream {
    # Para que el FTP y el SSH vean la IP real (HP-122)
    server {
        listen 2121;
        proxy_pass honeypot-interno:2121;
        proxy_protocol on;
    }

    server {
        listen 2222;
        proxy_pass honeypot-interno:2222;
        proxy_protocol on;
    }
}
