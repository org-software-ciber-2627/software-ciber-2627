spring.application.name=honeypot
spring.datasource.url=jdbc:h2:file:${HONEYPOT_DB_PATH:./data/honeypot};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Para el servicio señuelo SSH
# ssh -p 2222 root@localhost
honeypot.ssh.port=2222
honeypot.ssh.version=OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
honeypot.ssh.hostkey=hostkey.ser

# Detección de fuerza bruta (HP-12)
honeypot.fuerza-bruta.max-intentos=5
honeypot.fuerza-bruta.ventana-segundos=60

# Credenciales por defecto (HP-25). Formato usuario:contraseña separados por comas.
# En el login web el usuario es un correo: cuenta lo que va antes de la @
honeypot.credenciales-por-defecto=admin:admin,admin:1234,admin:password,root:root,root:toor,user:user,guest:guest,test:test

# Límite de peticiones por IP y segundo (HP-71)
honeypot.rate-limit.max-peticiones=10
