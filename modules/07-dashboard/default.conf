server {
    listen 80;

    # DNS interno de Docker, compartido por todos los proxies. La resolución es perezosa
    # (variable + resolver) para que nginx arranque aunque el módulo destino no esté levantado.
    resolver 127.0.0.11 valid=10s;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","module":"07-dashboard"}';
    }

    # Proxy hacia el SIEM: el SIEM no tiene CORS y el navegador no puede llamarlo desde
    # localhost:8007. El navegador pide /api/siem/alerts al propio Dashboard y nginx lo reenvía
    # a http://siem:80/alerts por la red de Docker. Solo se permite GET.
    # Si el SIEM no está levantado, la web recibe 502 y muestra su mensaje de error.
    location /api/siem/ {
        limit_except GET { deny all; }
        set $siem http://siem:80;
        rewrite ^/api/siem/(.*)$ /$1 break;
        proxy_pass $siem;
    }

    # Proxy hacia Identidad (login, validate, logout). Permite GET y POST.
    location /api/identidad/ {
        limit_except GET POST { deny all; }
        set $identidad http://identidad:80;
        rewrite ^/api/identidad/(.*)$ /$1 break;
        proxy_pass $identidad;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Retry-After;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}

