server {
    listen 80;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","module":"07-dashboard"}';
    }

    # Proxy hacia el SIEM: el SIEM no tiene CORS y el navegador no puede llamarlo desde
    # localhost:8007. El navegador pide /api/siem/alerts al propio Dashboard y nginx lo reenvía
    # a http://siem:80/alerts por la red de Docker. Solo se permite GET.
    # La resolución del nombre es perezosa (variable + resolver de Docker) para que nginx arranque
    # aunque el SIEM no esté levantado: en ese caso la web recibe 502 y muestra su mensaje de error.
    location /api/siem/ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s;
        set $siem http://siem:80;
        rewrite ^/api/siem/(.*)$ /$1 break;
        proxy_pass $siem;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
