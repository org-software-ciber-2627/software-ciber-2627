<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard CiberURJC - Grupo 7</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .sev { padding: 2px 10px; border-radius: 12px; font-weight: 600; }
        .critical { background: #7f1d1d; color: #fff; }
        .high { background: #fee2e2; color: #b91c1c; }
        .medium { background: #fef3c7; color: #b45309; }
        .low { background: #dcfce7; color: #15803d; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background-color: #b91c1c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .logout-btn:hover { background-color: #991b1b; }
    </style>
    <script>
        // Protección: Si no se ha iniciado sesión, redirige inmediatamente a login.html
        if (!sessionStorage.getItem("logged_in")) {
            window.location.href = "login.html";
        }
    </script>
</head>
<body>
    <div class="header-bar">
        <div>
            <h1>Dashboard Principal de Seguridad</h1>
            <h2>Últimas Alertas (Consumidas desde SIEM)</h2>
        </div>
        <div>
            <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>

    <div id="error" style="display:none;color:#b91c1c">No se pudo conectar con el SIEM.</div>

    <p>Última actualización: <strong><span id="hora-actualizacion">Cargando...</span></strong></p>

    <table id="tabla">
        <thead>
            <tr>
                <th>Severidad</th>
                <th>Título</th>
                <th>Módulo</th>
                <th>Hora</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="alerts-body">
        </tbody>
    </table>

    <section id="detalle-alerta" style="display:none; margin-top:24px;">
        <h2>Detalle de la alerta</h2>
        <button id="volver-alertas" type="button">Volver a las alertas</button>
        <div id="contenido-detalle"></div>
    </section>

    <script>
        function logout() {
            sessionStorage.removeItem("logged_in");
            sessionStorage.removeItem("token");
            window.location.href = "login.html";
        }
    </script>
    <script type="module" src="SIEM-alert.js"></script>
</body>
</html>
