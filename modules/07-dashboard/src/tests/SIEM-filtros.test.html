<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pruebas de filtros SIEM</title>
</head>
<body>
    <h1>Pruebas de filtros SIEM</h1>
    <p id="resultado">Ejecutando pruebas...</p>
    <ul id="resultados"></ul>

    <script type="module">
        import { filtrarAlertas } from "../SIEM-filtros.js";

        const alertas = [
            {
                alert_id: "1",
                severity: "critical",
                source: "ids",
                timestamp: "2026-09-22T10:00:00"
            },
            {
                alert_id: "2",
                severity: "high",
                source: "scanner",
                timestamp: "2026-09-23T12:00:00"
            },
            {
                alert_id: "3",
                severity: "medium",
                source: "ids",
                timestamp: "2026-09-24T15:00:00"
            },
            {
                alert_id: "4",
                severity: "low",
                source: "honeypot",
                timestamp: "2026-09-25T18:00:00"
            }
        ];

        const pruebas = [
            {
                nombre: "Filtrar por severidad",
                filtros: {
                    severidad: "critical",
                    origen: "",
                    desde: "",
                    hasta: ""
                },
                esperadas: ["1"]
            },
            {
                nombre: "Filtrar por origen",
                filtros: {
                    severidad: "",
                    origen: "ids",
                    desde: "",
                    hasta: ""
                },
                esperadas: ["1", "3"]
            },
            {
                nombre: "Filtrar por fecha inicial",
                filtros: {
                    severidad: "",
                    origen: "",
                    desde: "2026-09-24",
                    hasta: ""
                },
                esperadas: ["3", "4"]
            },
            {
                nombre: "Filtrar por fecha final",
                filtros: {
                    severidad: "",
                    origen: "",
                    desde: "",
                    hasta: "2026-09-23"
                },
                esperadas: ["1", "2"]
            },
            {
                nombre: "Combinar severidad y origen",
                filtros: {
                    severidad: "medium",
                    origen: "ids",
                    desde: "",
                    hasta: ""
                },
                esperadas: ["3"]
            },
            {
                nombre: "Combinar todos los filtros",
                filtros: {
                    severidad: "medium",
                    origen: "ids",
                    desde: "2026-09-24",
                    hasta: "2026-09-24"
                },
                esperadas: ["3"]
            },
            {
                nombre: "Sin filtros, mostrar todas las alertas",
                filtros: {
                    severidad: "",
                    origen: "",
                    desde: "",
                    hasta: ""
                },
                esperadas: ["1", "2", "3", "4"]
            }
        ];

        let correctas = 0;
        const lista = document.getElementById("resultados");

        pruebas.forEach(prueba => {
            const resultado = filtrarAlertas(alertas, prueba.filtros);

            const idsObtenidos = resultado
                .map(alerta => alerta.alert_id)
                .sort();

            const idsEsperados = [...prueba.esperadas].sort();

            const correcta =
                JSON.stringify(idsObtenidos) === JSON.stringify(idsEsperados);

            if (correcta) {
                correctas++;
            }

            const elemento = document.createElement("li");
            elemento.textContent =
                `${correcta ? "✓ CORRECTA" : "✗ INCORRECTA"} - ${prueba.nombre}`;

            lista.appendChild(elemento);
        });

        document.getElementById("resultado").textContent =
            `${correctas} de ${pruebas.length} pruebas superadas.`;
    </script>
</body>
</html>
